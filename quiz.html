<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz sénégalais — SunuPermis</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%23E0A639'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10332B">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/layout.js"></script>
<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<div id="sp-header-placeholder"></div>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        injectHeader("quiz.html");
      });
    </script>

<main id="main-content">
<section class="section-tight section-alt">
  <div class="container section-head left">
    <div class="kicker">S’évaluer</div>
    <h1>Quiz par thème</h1>
    <p>Entraîne-toi par thème avec des explications, des panneaux issus de ta banque et des supports visuels. Ton meilleur score est conservé sur cet appareil.</p>
    <div class="learning-stats" id="quizStats" aria-live="polite"></div>
    <a href="examen.html" class="btn btn-primary btn-sm">Démarrer le mode examen chronométré</a>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="tabs" id="themeTabs" role="tablist" aria-label="Thèmes du quiz"></div>
    <div class="quiz-shell" id="quizArea" role="tabpanel" tabindex="0" aria-live="polite" aria-labelledby="theme-tab-tous"></div>
  </div>
</section>

<script src="js/data.js"></script>
<script src="js/progress.js"></script>
<script src="js/progress-sync.js"></script>
<script src="js/quiz.js"></script>
<script>
var themes = ['tous','panneaux','priorites','vitesse','securite','depassement','stationnement','feux','comportement','manoeuvres','autoroute'];
var labels = {tous:'Tous les thèmes',panneaux:'Panneaux',priorites:'Priorités',vitesse:'Vitesse',securite:'Sécurité',depassement:'Dépassement',stationnement:'Stationnement',feux:'Feux et marquage',comportement:'Comportement / permis',manoeuvres:'Manœuvres',autoroute:'Autoroute'};
document.getElementById('themeTabs').innerHTML = themes.map(function(t,i){
  var n=QUIZ_BANK.filter(function(q){return t==='tous'||q.theme===t;}).length;
  return '<button type="button" id="theme-tab-'+t+'" class="tab-btn'+(i===0?' active':'')+'" role="tab" aria-controls="quizArea" aria-selected="'+(i===0?'true':'false')+'" tabindex="'+(i===0?'0':'-1')+'" data-t="'+t+'"><span>'+labels[t]+'</span><small>'+n+'</small></button>';
}).join('');
document.getElementById('themeTabs').addEventListener('click', function(e){
  var b = e.target.closest('.tab-btn'); if(!b) return;
  document.querySelectorAll('#themeTabs .tab-btn').forEach(function(x){
    var active = x === b;
    x.classList.toggle('active', active);
    x.setAttribute('aria-selected', active ? 'true' : 'false');
    x.tabIndex = active ? 0 : -1;
  });
  document.getElementById('quizArea').setAttribute('aria-labelledby', b.id);
  SPQuiz.start(b.dataset.t, 10);
});
document.getElementById('themeTabs').addEventListener('keydown', function(e){
  var current = e.target.closest('[role=tab]'); if (!current) return;
  var buttons = Array.from(document.querySelectorAll('#themeTabs [role=tab]'));
  var i = buttons.indexOf(current), next = null;
  if (e.key === 'ArrowRight') next = buttons[(i + 1) % buttons.length];
  else if (e.key === 'ArrowLeft') next = buttons[(i - 1 + buttons.length) % buttons.length];
  else if (e.key === 'Home') next = buttons[0];
  else if (e.key === 'End') next = buttons[buttons.length - 1];
  if (next) { e.preventDefault(); next.focus(); next.click(); }
});
SPQuiz.start('tous', 10);
if(window.SPProgress){var q=SPProgress.load();if(q&&q.quizScores.length){var last=q.quizScores[q.quizScores.length-1];document.getElementById('quizStats').innerHTML='<span class="badge badge-verified">Dernier score : '+last.score+'/'+last.total+'</span><span class="badge">'+q.quizScores.length+' quiz réalisés</span>';}}
</script>
</main>
<div id="sp-footer-placeholder"></div>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        injectFooter();
      });
    </script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
<script src="js/raoul-chat.js"></script>
</body>
</html>
