<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manœuvres — SunuPermis</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%23E0A639'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10332B">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/layout.js"></script>
<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<div id="sp-header-placeholder"></div>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        injectHeader("manoeuvres.html");
      });
    </script>

<main id="main-content">
<section class="section-tight section-alt">
  <div class="container section-head left">
    <div class="kicker">Pratique</div>
    <h1>Manœuvres</h1>
    <p>Créneau, stationnement en bataille ou en épi, marche arrière, demi-tour et démarrage en côte : explication, étapes, erreurs fréquentes et mini-quiz pour chaque manœuvre.</p>
  </div>
</section>

<section class="section">
  <div class="container grid grid-3" id="manoeuvreGrid"></div>
</section>

<div class="modal-backdrop" id="manModal" aria-hidden="true"><div class="modal" id="manModalContent" role="dialog" aria-modal="true" aria-labelledby="manModalTitle"></div></div>

<script src="js/data.js"></script>
<script>
document.getElementById('manoeuvreGrid').innerHTML = MANOEUVRES.map(function(m){
  return '<article class="card card-flag" data-id="'+m.id+'" tabindex="0" role="button" aria-haspopup="dialog" style="cursor:pointer;">'+
    '<h3>'+m.nom+'</h3><p>'+m.desc+'</p>'+
    '<span class="link-arrow">Voir les étapes →</span></article>';
}).join('');

var lastManoeuvreTrigger = null;
function openManoeuvre(card) {
  var m = MANOEUVRES.filter(function(x){return x.id===card.dataset.id;})[0];
  if (!m) return;
  lastManoeuvreTrigger = card;
  document.getElementById('manModalContent').innerHTML =
    '<button type="button" class="modal-close" id="closeMan" aria-label="Fermer les détails de la manœuvre">×</button>'+
    '<h2 id="manModalTitle">'+m.nom+'</h2><p>'+m.desc+'</p>'+
    '<h3 style="margin-top:18px;">Étapes</h3><ol class="steps">'+m.etapes.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol>'+
    '<h3 style="margin-top:18px;">Erreurs fréquentes</h3><ul>'+m.erreurs.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ul>'+
    '<a href="quiz.html" class="btn btn-outline btn-sm" style="margin-top:14px;">Tester mes connaissances</a>';
  var modal = document.getElementById('manModal');
  modal.classList.add('open');
  modal.setAttribute('aria-hidden', 'false');
  var close = document.getElementById('closeMan'); if (close) close.focus();
  if(window.SPProgress) SPProgress.markLessonSeen('manoeuvres:'+m.id);
}
document.getElementById('manoeuvreGrid').addEventListener('click', function(e){
  var c = e.target.closest('[data-id]'); if(c) openManoeuvre(c);
});
document.getElementById('manoeuvreGrid').addEventListener('keydown', function(e){
  var c = e.target.closest('[data-id]');
  if(c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openManoeuvre(c); }
});
function closeManoeuvre() {
  var modal = document.getElementById('manModal');
  modal.classList.remove('open');
  modal.setAttribute('aria-hidden', 'true');
  if (lastManoeuvreTrigger) lastManoeuvreTrigger.focus();
}
document.addEventListener('click', function(e){
  if(e.target.id === 'closeMan' || e.target.id === 'manModal') closeManoeuvre();
});
document.addEventListener('keydown', function(e){
  var modal = document.getElementById('manModal');
  if (!modal.classList.contains('open')) return;
  if (e.key === 'Escape') { closeManoeuvre(); return; }
  if (e.key === 'Tab') {
    var focusables = Array.from(modal.querySelectorAll('button:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])'));
    if (!focusables.length) { e.preventDefault(); return; }
    var first = focusables[0], last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
</script>
<script src="js/progress.js"></script>
<script src="js/progress-sync.js"></script>
</main>
<div id="sp-footer-placeholder"></div>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        injectFooter();
      });
    </script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
<script src="js/raoul-chat.js"></script>
</body>
</html>
