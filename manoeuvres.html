<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manœuvres — SunuPermis</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%23E0A639'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10332B">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/layout.js"></script>
<script src="js/i18n.js"></script>
<script>document.write(spHeader('manoeuvres.html'));</script>

<main id="main-content">
<section class="section-tight section-alt">
  <div class="container section-head left">
    <div class="kicker">Pratique</div>
    <h1>Manœuvres</h1>
    <p>Créneau, stationnement en bataille ou en épi, marche arrière, demi-tour et démarrage en côte : explication, étapes, erreurs fréquentes et mini-quiz pour chaque manœuvre.</p>
  </div>
</section>

<section class="section">
  <div class="container grid grid-3" id="manoeuvreGrid"></div>
</section>

<div class="modal-backdrop" id="manModal"><div class="modal" id="manModalContent"></div></div>

<script src="js/data.js"></script>
<script>
document.getElementById('manoeuvreGrid').innerHTML = MANOEUVRES.map(function(m){
  return '<div class="card card-flag" data-id="'+m.id+'" style="cursor:pointer;">'+
    '<h3>'+m.nom+'</h3><p>'+m.desc+'</p>'+
    '<span class="link-arrow">Voir les étapes →</span></div>';
}).join('');

document.getElementById('manoeuvreGrid').addEventListener('click', function(e){
  var c = e.target.closest('[data-id]'); if(!c) return;
  var m = MANOEUVRES.filter(function(x){return x.id===c.dataset.id;})[0];
  document.getElementById('manModalContent').innerHTML =
    '<button class="modal-close" id="closeMan">×</button>'+
    '<h3>'+m.nom+'</h3><p>'+m.desc+'</p>'+
    '<h4 style="margin-top:18px;">Étapes</h4><ol class="steps">'+m.etapes.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol>'+
    '<h4 style="margin-top:18px;">Erreurs fréquentes</h4><ul>'+m.erreurs.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ul>'+
    '<a href="quiz.html" class="btn btn-outline btn-sm" style="margin-top:14px;">Tester mes connaissances</a>';
  document.getElementById('manModal').classList.add('open');
  if(window.SPProgress) SPProgress.markLessonSeen('manoeuvres:'+m.id);
});
document.addEventListener('click', function(e){
  if(e.target.id==='closeMan'||e.target.id==='manModal') document.getElementById('manModal').classList.remove('open');
});
</script>
<script src="js/progress.js"></script>
</main>
<script>document.write(spFooter());</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
</body>
</html>
